name: deploy-kit

# The deployment kit is the one part of this project a developer laptop cannot
# verify: it needs Linux, Docker and (for the real target) an arm64 host.
# So CI builds the actual image and drives the actual HTTP API instead of
# trusting the Dockerfile by inspection.
#
# The amd64 job runs the full smoke test. The arm64 job only builds, because
# Oracle's Always Free shape is Ampere — it proves every dependency resolves
# and the model bakes in on aarch64, which is the part that differs.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "extension/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy-kit.yml"
  pull_request:
    paths:
      - "backend/**"
      - "extension/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy-kit.yml"
  workflow_dispatch:

# The arm64 job builds the whole torch image under QEMU, so superseded pushes
# should not keep stacking up expensive builds.
concurrency:
  group: deploy-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-package:
    name: Extension package loads and is store-consistent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Resolves every path the way Chrome would (including the importScripts
      # in the service worker), parses every script, and prints the Chrome Web
      # Store policy flags as warnings.
      - run: node deploy/check-extension.mjs

      # Provider adapters are pure request/response builders, so they are
      # checked without any API key: known hashes for the two signed Chinese
      # APIs, the exact request each provider sends, and a fixture for every
      # response shape.
      - run: node deploy/check-providers.mjs

      - name: Install Puppeteer
        run: npm install --no-save --no-package-lock puppeteer

      # The translated overlay has to actually cover the original lettering, so
      # both the old and the new background reconstruction are scored against a
      # synthetic patch whose true background is known.
      - name: Score the background reconstruction
        run: xvfb-run -a node deploy/check-inpaint.mjs

      # Settings and popup wiring, plus a real translation round trip against a
      # local stand-in for an OpenAI-compatible service. Port 8001 is reused
      # because it is already in host_permissions and nothing else runs in this
      # job.
      - name: Drive the settings page and translate for real
        run: xvfb-run -a node deploy/check-ui.mjs

  api-image:
    name: Build image (amd64) and smoke-test the API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: The compose file renders with a real domain
        run: |
          set -euo pipefail
          # Catches compose syntax errors and unresolved variables, which would
          # otherwise only surface on the VM after bootstrap-vm.sh has run.
          MAS_DOMAIN=ocr.example.com docker compose -f deploy/docker-compose.yml config > compose-rendered.yml
          grep -q "ocr.example.com" compose-rendered.yml
          grep -q "8001" compose-rendered.yml
          grep -q "caddy" compose-rendered.yml
          echo "compose file renders OK"

      - name: Build the backend image
        run: docker build -f deploy/Dockerfile -t mas-backend:test .

      - name: Start the container with production-like settings
        run: |
          docker run -d --name omt -p 127.0.0.1:8001:8001 \
            -e MAS_TORCH_THREADS=2 \
            -e MAS_OCR_CONCURRENCY=1 \
            -e MAS_RATE_LIMIT_REQUESTS=4 \
            -e MAS_RATE_LIMIT_WINDOW=60 \
            -e MAS_PRELOAD_MODEL=1 \
            mas-backend:test

      - name: Wait for /health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8001/health > health.json; then
              echo "healthy after ${attempt} attempt(s)"
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy"
          docker logs omt || true
          exit 1

      - name: The model was preloaded at startup, not on first request
        run: |
          set -euo pipefail
          # Operators are told to look for this line in `docker compose logs`;
          # if logging regresses, the guide silently stops working.
          docker logs omt 2>&1 | tee startup.log
          grep -q "模型已预加载" startup.log \
            || { echo "::error::model preload log line missing"; exit 1; }
          # A cold interpreter is ~15 MB; the resident model is ~800 MB.
          # Read PID 1 (the uvicorn process) — `docker exec python` would spawn
          # a fresh interpreter and measure that instead.
          rss_kb=$(docker exec omt python -c \
            "import re; print(re.search(r'VmRSS:\s+(\d+)', open('/proc/1/status').read()).group(1))")
          echo "pid 1 VmRSS: ${rss_kb} kB"
          [ "$rss_kb" -gt 200000 ] \
            || { echo "::error::model does not look resident (${rss_kb} kB)"; exit 1; }

      - name: Health payload carries the fields the extension relies on
        run: |
          python3 - <<'PY'
          import json
          health = json.load(open("health.json"))
          assert health["ok"] is True, health
          assert health["ocr"] == "mangaocr", health
          assert health["concurrency"] >= 1, health
          assert health["busy"] == 0, health
          print("health OK:", health)
          PY

      - name: Real OCR round-trip over HTTP
        run: |
          set -euo pipefail
          # Build the probe inside the container: it already has Pillow, so CI
          # needs no extra dependencies and nothing binary is committed.
          # `-i` matters: without it docker exec does not attach stdin and the
          # heredoc is silently discarded.
          docker exec -i omt python - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGB", (640, 480), "white")
          draw = ImageDraw.Draw(img)

          # White balloons with dark glyph-like strokes: the common case.
          for bx, by, bw, bh in [(40, 40, 200, 160), (300, 40, 200, 160), (40, 300, 200, 140)]:
              draw.rectangle([bx, by, bx + bw, by + bh], outline="black", width=3)
              for row in range(20, bh - 20, 28):
                  for col in range(20, bw - 30, 26):
                      draw.rectangle([bx + col, by + row, bx + col + 18, by + row + 18], fill="black")

          # One dark panel with light lettering: exercises the other polarity.
          draw.rectangle([300, 300, 500, 440], fill="#141414")
          for row in range(20, 110, 28):
              for col in range(20, 150, 26):
                  draw.rectangle([300 + col, 300 + row, 300 + col + 18, 300 + row + 18], fill="white")

          img.save("/tmp/probe.png")
          print("probe image written")
          PY
          docker cp omt:/tmp/probe.png /tmp/probe.png

          echo "--- POST /api/recognize-image ---"
          curl -fsS --max-time 300 -X POST -F "image=@/tmp/probe.png;type=image/png" \
            http://127.0.0.1:8001/api/recognize-image -o recognize-image.json
          python3 -c "import json;d=json.load(open('recognize-image.json'));assert d['ok'] is True,d;print('ok, items:',d['items'])"

          echo "--- POST /api/recognize-page ---"
          curl -fsS --max-time 600 -X POST -F "image=@/tmp/probe.png;type=image/png" \
            http://127.0.0.1:8001/api/recognize-page -o recognize-page.json
          python3 -c "import json;d=json.load(open('recognize-page.json'));assert d['ok'] is True,d;print('ok, regions:',len(d['items']))"

          echo "--- POST /api/translate-text (mode=none must echo) ---"
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' \
            -d '{"texts":["こんにちは"],"mode":"none"}' \
            http://127.0.0.1:8001/api/translate-text -o translate.json
          python3 -c "import json;d=json.load(open('translate.json'));assert d['items'][0]['translated']=='こんにちは',d;print('ok')"

      - name: Uploads are bounded (413 for an oversized image)
        run: |
          set -euo pipefail
          head -c 16000000 /dev/zero > /tmp/too-big.png
          code=$(curl -s -o body.txt -w '%{http_code}' --max-time 120 \
            -X POST -F "image=@/tmp/too-big.png;type=image/png" \
            http://127.0.0.1:8001/api/recognize-image)
          echo "oversized upload -> HTTP ${code}: $(cat body.txt)"
          [ "$code" = "413" ] || { echo "::error::expected 413"; exit 1; }

      - name: Rate limit engages, /health stays reachable
        run: |
          set -euo pipefail
          codes=""
          for _ in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              -X POST -H 'Content-Type: application/json' \
              -d '{"texts":["テスト"],"mode":"none"}' \
              http://127.0.0.1:8001/api/translate-text)
            codes="$codes $code"
          done
          echo "codes:${codes}"
          echo "${codes}" | grep -q 429 || { echo "::error::rate limiter never engaged"; exit 1; }
          # /health is deliberately exempt so monitoring and the extension's
          # reachability probe keep working while a client is throttled.
          curl -fsS --max-time 10 http://127.0.0.1:8001/health > /dev/null
          echo "health reachable while throttled"

      # The package being internally consistent is not the same as Chrome
      # accepting it: this loads the real extension into a real browser, which
      # is the only way to prove importScripts() works in an MV3 service worker
      # and that the popup can actually talk to the running API.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install --no-save --no-package-lock puppeteer

      - name: Load the extension into Chrome and drive it
        run: xvfb-run -a node deploy/check-extension-browser.mjs --backend http://127.0.0.1:8001

      - name: Container logs on failure
        if: failure()
        run: docker logs omt | tail -n 120

  caddy-stack:
    name: Full stack behind Caddy (TLS + reverse proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Bring up deploy/docker-compose.yml the way the VM would
        run: |
          set -euo pipefail
          # The real Caddyfile is swapped for one that uses Caddy's internal CA,
          # because CI cannot answer a Let's Encrypt HTTP-01 challenge. Every
          # other part — TLS termination, resolving the `api` service name,
          # proxying, the published ports — runs exactly as on the VM.
          mkdir -p /tmp/mas-tls
          cat > /tmp/mas-tls/Caddyfile <<'CADDY'
          {
          	local_certs
          	skip_install_trust
          }

          localhost {
          	encode zstd gzip
          	reverse_proxy api:8001
          }
          CADDY
          cat > /tmp/mas-tls/compose.override.yml <<'YAML'
          services:
            caddy:
              volumes:
                - /tmp/mas-tls/Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config
          YAML
          MAS_DOMAIN=localhost docker compose \
            -p omt \
            -f deploy/docker-compose.yml \
            -f /tmp/mas-tls/compose.override.yml \
            up -d --build
          docker compose -p omt ps

      - name: HTTPS through Caddy reaches the API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -kfsS --max-time 5 https://localhost/health > caddy-health.json 2>/dev/null; then
              echo "TLS endpoint healthy after ${attempt} attempt(s)"
              cat caddy-health.json
              break
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          health = json.load(open("caddy-health.json"))
          assert health["ok"] is True, health
          assert health["ocr"] == "mangaocr", health
          print("proxied health OK:", health)
          PY

      - name: Plain HTTP is redirected to HTTPS
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://localhost/health)
          echo "http://localhost/health -> ${code}"
          [ "$code" = "308" ] || { echo "::error::expected a redirect to HTTPS"; exit 1; }

      - name: A screenshot survives the proxy (multipart POST through Caddy)
        run: |
          set -euo pipefail
          # `-T` for the same reason as `docker exec -i`: without it the heredoc
          # is not attached to stdin and the generator silently does nothing.
          docker compose -p omt exec -T api python - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGB", (480, 320), "white")
          draw = ImageDraw.Draw(img)
          for row in range(20, 260, 34):
              for col in range(20, 380, 30):
                  draw.rectangle([col, row, col + 20, row + 20], fill="black")
          img.save("/tmp/probe.png")
          PY
          docker compose -p omt cp api:/tmp/probe.png /tmp/probe-caddy.png
          curl -kfsS --max-time 300 -X POST \
            -F "image=@/tmp/probe-caddy.png;type=image/png" \
            https://localhost/api/recognize-image -o caddy-recognize.json
          python3 -c "import json;d=json.load(open('caddy-recognize.json'));assert d['ok'] is True,d;print('proxied OCR ok, items:',d['items'])"

      - name: Compose logs on failure
        if: failure()
        run: |
          MAS_DOMAIN=localhost docker compose -p omt \
            -f deploy/docker-compose.yml -f /tmp/mas-tls/compose.override.yml \
            logs --tail 120 || true

      - name: Tear down
        if: always()
        run: |
          MAS_DOMAIN=localhost docker compose -p omt \
            -f deploy/docker-compose.yml -f /tmp/mas-tls/compose.override.yml \
            down -v || true

  arm64-image:
    name: Build and run image (linux/arm64, the Always Free target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build for linux/arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -f deploy/Dockerfile \
            -t mas-backend:arm64 \
            .
          echo "arm64 image built"

      # Building proves the wheels install; it does NOT prove torch imports on
      # aarch64, because nothing in the build imports torch. Only running the
      # image catches a broken ARM wheel — and that is exactly what would
      # otherwise fail on the Oracle instance.
      - name: Run the arm64 image under emulation and serve OCR
        run: |
          set -euo pipefail
          docker run -d --name mas-arm64 --platform linux/arm64 \
            -p 127.0.0.1:8001:8001 \
            -e MAS_PRELOAD_MODEL=1 \
            -e MAS_TORCH_THREADS=2 \
            mas-backend:arm64

          # Torch import and model load are emulated, so this is slow: wait up
          # to ~25 minutes. uvicorn does not accept connections until the
          # lifespan preload finishes, so an answer here means the model loaded.
          healthy=no
          for attempt in $(seq 1 150); do
            if curl -fsS --max-time 5 http://127.0.0.1:8001/health > arm-health.json 2>/dev/null; then
              echo "arm64 backend healthy after $((attempt * 10))s"
              cat arm-health.json
              healthy=yes
              break
            fi
            sleep 10
          done
          if [ "$healthy" != "yes" ]; then
            echo "::error::arm64 image never became healthy"
            docker logs mas-arm64 | tail -n 60
            exit 1
          fi

      - name: OCR works on aarch64 too
        run: |
          set -euo pipefail
          docker exec -i mas-arm64 python - <<'PY'
          from PIL import Image, ImageDraw

          # Small on purpose: emulated inference is slow, and this only needs to
          # prove the aarch64 forward pass runs and returns plausible text.
          img = Image.new("RGB", (240, 160), "white")
          draw = ImageDraw.Draw(img)
          for row in range(20, 130, 30):
              for col in range(20, 190, 26):
                  draw.rectangle([col, row, col + 16, row + 16], fill="black")
          img.save("/tmp/probe.png")
          PY
          docker cp mas-arm64:/tmp/probe.png /tmp/probe-arm.png
          curl -fsS --max-time 900 -X POST \
            -F "image=@/tmp/probe-arm.png;type=image/png" \
            http://127.0.0.1:8001/api/recognize-image -o arm-recognize.json
          python3 -c "import json;d=json.load(open('arm-recognize.json'));assert d['ok'] is True,d;print('arm64 OCR ok, items:',d['items'])"

      - name: Emulated container logs on failure
        if: failure()
        run: docker logs mas-arm64 | tail -n 120 || true

      - name: Tear down
        if: always()
        run: docker rm -f mas-arm64 || true
