<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MasLingo 阅读侧栏</title>
    <link rel="stylesheet" href="../ui/system.css" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">M</span>
        <div>
          <h1>MasLingo</h1>
          <p class="sub">让阅读保持完整</p>
        </div>
      </div>
    </header>
    <nav aria-label="侧栏页面">
      <button id="read-tab" aria-pressed="true">阅读</button
      ><button id="setup-tab" aria-pressed="false">设置</button>
    </nav>
    <main>
      <section id="read-view">
        <div class="modes">
          <label class="row"
            ><span>网页自动翻译</span
            ><span class="switch"
              ><input id="webAutoTranslate" type="checkbox" /><span
                class="switch-track"
                ><span class="switch-thumb"></span></span></span
          ></label>
          <label class="row"
            ><span>悬停翻译</span
            ><span class="switch"
              ><input id="hoverTranslate" type="checkbox" /><span
                class="switch-track"
                ><span class="switch-thumb"></span></span></span
          ></label>
          <label class="row"
            ><span>漫画自动翻译</span
            ><span class="switch"
              ><input id="autoTranslate" type="checkbox" /><span
                class="switch-track"
                ><span class="switch-thumb"></span></span></span
          ></label>
          <label class="row"
            ><span>划词词典</span
            ><span class="switch"
              ><input id="selectionTranslate" type="checkbox" /><span
                class="switch-track"
                ><span class="switch-thumb"></span></span></span
          ></label>
          <label class="row"
            ><span>输入框翻译后自动替换</span
            ><span class="switch"
              ><input id="inputAutoReplace" type="checkbox" /><span
                class="switch-track"
                ><span class="switch-thumb"></span></span></span
          ></label>
          <label class="row"
            ><span>显示方式</span
            ><select id="webDisplayMode">
              <option value="bilingual">双语对照</option>
              <option value="translated">纯译文</option>
              <option value="source">纯原文</option>
            </select></label
          >
          <button class="primary wide" id="select">框选翻译</button>
          <p id="provider-hint" class="hint"></p>
        </div>
        <details id="current-results">
          <summary class="section-head">当前译文 <span id="result-count" hidden></span></summary>
          <button class="link" id="clear">清空</button>
          <p id="empty" class="empty">
            在网页上停留或选中文字，译文会显示在这里。<br />漫画中需要保留原画的文字，也会集中到此处。
          </p>
          <div id="results"></div>
        </details>
        <section class="video-section">
          <h2>视频字幕</h2>
          <p class="hint">
            字幕和控制位于视频下方，支持双语、纯译文与原文。无字幕时可共享标签页声音进行识别。
          </p>
          <button id="video">定位视频与字幕控制</button>
        </section>
      </section>
      <section id="setup-view" hidden>
        <h2>翻译偏好</h2>
        <label class="field"
          >翻译来源<select id="translationProvider"></select></label
        ><label class="field"
          >目标语言<select id="targetLanguage"></select></label
        ><label class="field"
          >术语库<select id="translationGlossary"></select
        ></label>
        <p class="hint">偏好即时保存。模型、密钥和识别服务在完整设置中管理。</p>
        <button id="settings" class="primary wide">打开完整设置</button
        ><button id="health" class="wide">检查识别服务</button>
      </section>
    </main>
    <footer>
      <p id="activity" role="status" aria-live="polite">准备就绪</p>
      <p class="hint" id="provider-label"></p>
    </footer>
    <script src="../config.js"></script>
    <script src="../translation/providers.js"></script>
    <script src="reader.js"></script>
  </body>
</html>
