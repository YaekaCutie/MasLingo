<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manga Translator 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Manga Translator</h1>
    <p class="sub">本机 PaddleOCR + Ollama 视觉模型设置</p>

    <section class="panel">
      <label for="model">Ollama 视觉模型</label>
      <div class="key-row">
        <input id="model" type="text" autocomplete="off" value="qwen2.5vl:7b" placeholder="qwen2.5vl:7b">
      </div>
      <div class="hint">模型在本机运行并接收选区图片与 OCR 文本。可用 `ollama pull qwen2.5vl:7b` 下载。</div>

      <label class="toggle-row" for="debugMode">
        <input id="debugMode" type="checkbox" checked>
        <span>调试模式：显示 OCR 原文和中文译文</span>
      </label>
      <div class="hint">开启后会在结果窗逐条显示 OCR 识别内容及对应译文。</div>

      <div class="actions">
        <button id="save" class="primary">保存</button>
        <button id="test">测试本机模型</button>
      </div>
      <div id="result" class="result">尚未测试</div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
