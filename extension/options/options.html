<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manga Translator 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Manga Translator</h1>
    <p class="sub">本机 MangaOCR 识别设置</p>

    <section class="panel">
      <label class="toggle-row" for="debugMode">
        <input id="debugMode" type="checkbox" checked>
        <span>显示 OCR 识别结果</span>
      </label>
      <div class="hint">关闭后只保留识别流程，不影响结果内容。</div>

      <div class="actions">
        <button id="save" class="primary">保存</button>
      </div>
      <div id="result" class="result">MangaOCR 本地识别模式</div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
