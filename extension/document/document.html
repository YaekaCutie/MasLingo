<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MasLingo 文档翻译</title>
  <link rel="stylesheet" href="../ui/system.css">
  <link rel="stylesheet" href="document.css">
</head>
<body>
  <main>
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <div><h1>文档翻译</h1><p>翻译办公文档、PDF、电子书和文本文件</p></div>
    </header>
    <form id="form">
      <fieldset id="fields">
        <label class="file">选择文件
          <input id="file" type="file" accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt,.odt,.ods,.odp,.rtf,.pdf,.epub,.txt,.md,.markdown,.html,.htm,.csv,.tsv,.srt,.vtt" required>
          <span class="hint">单文件最大 15 MB。支持 Word、Excel、PowerPoint、OpenDocument、PDF、EPUB、RTF、TXT、Markdown、HTML、CSV、TSV、SRT 和 WebVTT。</span>
        </label>
        <label>源语言<select id="source"></select></label>
        <label>目标语言<select id="target"></select></label>
        <label class="file">输出方式<select id="mode">
          <option value="bilingual">双语对照</option>
          <option value="translated">纯译文</option>
        </select></label>
        <p class="hint file" id="route"></p>
        <p class="hint file" id="format-note" hidden></p>
      </fieldset>
      <div class="actions">
        <button class="primary" id="translate" type="submit" disabled>翻译并下载</button>
        <button id="cancel" type="button" hidden>取消</button>
      </div>
      <progress id="progress" aria-label="文档翻译进度" hidden></progress>
      <p id="status" role="status">请选择要翻译的文件。</p>
    </form>
  </main>
  <script src="../config.js"></script>
  <script src="../translation/providers.js"></script>
  <script src="document.js"></script>
</body>
</html>
