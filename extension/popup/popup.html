<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="title-row">
      <div>
        <h1>Manga Translator</h1>
        <p>Gemini 批量翻译版</p>
      </div>
      <button id="settings" class="icon-btn" title="设置">⚙</button>
    </div>

    <section class="card">
      <div class="row"><span>Gemini</span><strong id="geminiStatus">检查中…</strong></div>
      <div class="row"><span>模型</span><span id="modelName">—</span></div>
    </section>

    <button id="select" class="primary">选择漫画区域并翻译</button>
    <button id="health">检查后端</button>
    <button id="settings2">API Key / 模型设置</button>
    <pre id="status">准备就绪</pre>
  </main>
  <script src="popup.js"></script>
</body>
</html>
