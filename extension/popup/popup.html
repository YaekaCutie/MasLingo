<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Manga Translator</h1>
      <button id="settings" class="icon-btn" title="设置" aria-label="设置">⚙</button>
    </header>

    <section class="status" id="statusCard">
      <div class="status-row">
        <span class="status-label">OCR</span>
        <span class="status-value" id="ocrStatus">检测中…</span>
      </div>
      <div class="status-row">
        <span class="status-label">翻译</span>
        <span class="status-value" id="translateStatus">检测中…</span>
      </div>
    </section>

    <p class="notice" id="translateHint" hidden>
      翻译未开启，识别后只会显示日文。<button id="openSettings" type="button">去开启翻译</button>
    </p>

    <button id="select" class="primary">框选区域并识别</button>
    <button id="auto">自动识别整页气泡</button>

    <details id="details">
      <summary>诊断信息</summary>
      <pre id="status">准备就绪</pre>
      <div class="detail-actions">
        <button id="health" class="ghost">检查 OCR 后端</button>
        <button id="settings2" class="ghost">打开设置</button>
      </div>
    </details>
  </main>
  <script src="../config.js"></script>
  <script src="../translation/providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
