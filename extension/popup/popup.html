<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="title-row">
      <div>
        <h1>Manga Translator</h1>
        <p>OCR 本机运行 · 翻译需在设置中启用</p>
      </div>
      <button id="settings" class="icon-btn" title="设置">⚙</button>
    </div>

    <section class="card">
      <div class="row"><span>OCR 引擎</span><strong>MangaOCR</strong></div>
      <div class="row"><span>OCR 运行方式</span><span>本机离线</span></div>
    </section>

    <button id="auto" class="primary">自动识别当前页面气泡</button>
    <button id="select" class="primary">选择漫画区域并识别</button>
    <button id="health">检查后端</button>
    <button id="settings2">识别设置</button>
    <pre id="status">准备就绪</pre>
  </main>
  <script src="popup.js"></script>
</body>
</html>
