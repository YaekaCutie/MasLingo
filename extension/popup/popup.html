<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenMangaTranslator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>OpenMangaTranslator</h1>
      <button id="settings" class="icon-btn" title="设置" aria-label="设置">⚙</button>
    </header>

    <section class="feature">
      <div class="feature-head">
        <span class="feature-title">自动翻译</span>
        <label class="switch">
          <input id="autoTranslate" type="checkbox">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
      <div class="state" id="autoState">
        <span class="state-dot"></span><span id="autoStateText">未开启</span>
      </div>
      <p class="hint">开启后自动识别页面上的漫画并翻译，译文跟随滚动，同一处不会重复处理。</p>
    </section>

    <section class="feature muted">
      <div class="feature-title">手动翻译</div>
      <button id="select">框选翻译</button>
      <p class="hint">在漫画上拖一个框，只翻译这一块。</p>
    </section>

    <details id="details">
      <summary>诊断信息</summary>
      <pre id="status">准备就绪</pre>
      <div class="detail-actions">
        <button id="health" class="ghost">检查 OCR 后端</button>
        <button id="autoPage" class="ghost">识别整页气泡</button>
      </div>
    </details>
  </main>

  <script src="../config.js"></script>
  <script src="../translation/providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
