# MasLingo shared backend — one small VM, two containers.
#
#   api   : FastAPI + MangaOCR (CPU), only reachable from the caddy container
#   caddy : terminates TLS with a Let's Encrypt certificate and proxies to api
#
# Copy .env.example to .env, set MAS_DOMAIN, then: docker compose up -d --build

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Always Free ARM is 2 OCPUs: one torch thread per OCR job and two jobs
      # keeps both cores busy without oversubscribing them.
      MAS_TORCH_THREADS: ${MAS_TORCH_THREADS:-1}
      MAS_OCR_CONCURRENCY: ${MAS_OCR_CONCURRENCY:-2}
      MAS_RATE_LIMIT_REQUESTS: ${MAS_RATE_LIMIT_REQUESTS:-40}
      MAS_RATE_LIMIT_WINDOW: ${MAS_RATE_LIMIT_WINDOW:-60}
      MAS_ALLOWED_ORIGINS: ${MAS_ALLOWED_ORIGINS:-*}
      MAS_ENABLE_FREE_TRANSLATE: ${MAS_ENABLE_FREE_TRANSLATE:-1}
    expose:
      - "8001"
    # A big page plus torch can reach ~3 GB; keep the container honest.
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MAS_DOMAIN: ${MAS_DOMAIN:?set MAS_DOMAIN in deploy/.env}
      MAS_ACME_EMAIL: ${MAS_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
